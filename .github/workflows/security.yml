name: Security

# Regular security checks: static code analysis (CodeQL, security-extended queries) and known-vulnerable
# NuGet packages. Runs on every push to main, on pull requests and every Monday.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: ${{ matrix.build-mode }}
      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build PaCo.slnx -c Release -p:EnableWindowsTargeting=true
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  vulnerable-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore PaCo.slnx -p:EnableWindowsTargeting=true
      - name: Known vulnerable packages (fails the run if any)
        shell: bash
        run: |
          dotnet list PaCo.slnx package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi
